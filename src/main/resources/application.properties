spring.application.name=Jura
spring.datasource.url=jdbc:mysql://localhost:3306/jura
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

server.error.include-message=always
server.error.include-stacktrace=always

zoom.account-id=${ZOOM_ACCOUNT_ID:}
zoom.client-id=${ZOOM_CLIENT_ID:}
zoom.client-secret=${ZOOM_CLIENT_SECRET:}
zoom.host-user-id=${ZOOM_HOST_USER_ID:}

# Gemini course-prototype interaction checks
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# Scans missed doses every minute; two-hour threshold is fixed in the service.
jura.doses.scan-interval-ms=60000
jura.doses.auto-missed-enabled=${AUTO_MISSED_ENABLED:true}

# Gmail SMTP: use a Google App Password, not your normal account password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SENDER_EMAIL:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000
spring.mail.test-connection=false

# Public frontend address included in appointment notifications.
jura.frontend-url=${JURA_FRONTEND_URL:http://localhost:8080/}
